<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1580" viewBox="0 0 1560 1580" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ar" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#111"/></marker></defs><rect width="1560" height="1580" fill="#fff"/><g transform="translate(0,0)"><text x="780" y="45" font-size="24" text-anchor="middle" font-weight="bold" fill="#111">MCU Flowchart (STM32L432KC)</text><text x="360" y="98" font-size="20" text-anchor="middle" font-weight="bold" fill="#111">main</text><polyline points="315,106 405,106" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="miter"/><rect x="200.0" y="125" width="320" height="68" rx="12" fill="#fff" stroke="#111" stroke-width="2"/><text x="360" y="154.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">init: 80 MHz clock, GPIO, SPI1 + DMA,</text><text x="360" y="173.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">SPI3, EXTI (frame_rdy), RTC wakeup</text><polyline points="360,193 360,223" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><rect x="200.0" y="223" width="320" height="68" rx="12" fill="#fff" stroke="#111" stroke-width="2"/><text x="360" y="252.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">load templates from flash,</text><text x="360" y="271.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">clear OLED</text><polyline points="360,291 360,330" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="miter"/><circle cx="360" cy="330" r="4.5" fill="#111"/><polyline points="360,330 360,368" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><polygon points="360,375.0 490.0,430 360,485.0 230.0,430" fill="#fff" stroke="#111" stroke-width="2"/><text x="360" y="435.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#111">frame_ready?</text><text x="500" y="420" font-size="13" text-anchor="start" font-weight="bold" fill="#b0281c">no</text><polyline points="490,430 1010,430" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="miter"/><text x="370" y="505" font-size="13" text-anchor="start" font-weight="bold" fill="#b0281c">yes</text><polyline points="360,485 360,520" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><rect x="180.0" y="520" width="360" height="87" rx="12" fill="#fff" stroke="#111" stroke-width="2"/><text x="360" y="549.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">clear frame_ready</text><text x="360" y="568.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">refresh clock / timer if RTC set redraw</text><text x="360" y="587.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">E = sum of the 32 log-mel energies</text><polyline points="360,607 360,642" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><polygon points="360,642.0 510.0,702 360,762.0 210.0,702" fill="#fff" stroke="#111" stroke-width="2"/><text x="360" y="697.5" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#111">E &gt; speech</text><text x="360" y="716.5" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#111">threshold?</text><text x="520" y="692" font-size="13" text-anchor="start" font-weight="bold" fill="#b0281c">yes</text><polyline points="510,702 600,702" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><rect x="600.0" y="662" width="360" height="80" rx="12" fill="#fff" stroke="#111" stroke-width="2"/><text x="780" y="688.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">MFCCs: DCT of log-mel</text><text x="780" y="707.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">→ 13 coeffs, append</text><text x="780" y="726.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">frame to word buffer</text><polyline points="960,702 1010,702" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="miter"/><text x="370" y="782" font-size="13" text-anchor="start" font-weight="bold" fill="#b0281c">no</text><polyline points="360,762 360,797" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><polygon points="360,797.0 520.0,857 360,917.0 200.0,857" fill="#fff" stroke="#111" stroke-width="2"/><text x="360" y="852.5" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#111">word buffered and</text><text x="360" y="871.5" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#111">≥ 15 quiet frames?</text><text x="530" y="847" font-size="13" text-anchor="start" font-weight="bold" fill="#b0281c">no</text><polyline points="520,857 1010,857" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="miter"/><text x="370" y="937" font-size="13" text-anchor="start" font-weight="bold" fill="#b0281c">yes</text><polyline points="360,917 360,952" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><polygon points="360,952.0 490.0,1007 360,1062.0 230.0,1007" fill="#fff" stroke="#111" stroke-width="2"/><text x="360" y="1012.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#111">enroll mode?</text><text x="500" y="997" font-size="13" text-anchor="start" font-weight="bold" fill="#b0281c">yes</text><polyline points="490,1007 600,1007" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><rect x="600.0" y="967" width="360" height="80" rx="12" fill="#fff" stroke="#111" stroke-width="2"/><text x="780" y="1002.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">save buffer as template</text><text x="780" y="1021.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">#k to flash, clear buffer</text><polyline points="960,1007 1010,1007" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="miter"/><text x="370" y="1082" font-size="13" text-anchor="start" font-weight="bold" fill="#b0281c">no</text><polyline points="360,1062 360,1097" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><rect x="200.0" y="1097" width="320" height="68" rx="12" fill="#fff" stroke="#111" stroke-width="2"/><text x="360" y="1126.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">DTW vs. 57 templates</text><text x="360" y="1145.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">→ best word w, distance d</text><polyline points="360,1165 360,1200" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><polygon points="360,1200.0 510.0,1260 360,1320.0 210.0,1260" fill="#fff" stroke="#111" stroke-width="2"/><text x="360" y="1255.5" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#111">d &lt; reject</text><text x="360" y="1274.5" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#111">threshold?</text><text x="520" y="1250" font-size="13" text-anchor="start" font-weight="bold" fill="#b0281c">no</text><polyline points="510,1260 600,1260" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><rect x="600.0" y="1230" width="360" height="60" rx="12" fill="#fff" stroke="#111" stroke-width="2"/><text x="780" y="1255.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">discard word,</text><text x="780" y="1274.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">clear buffer</text><polyline points="960,1260 1010,1260" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="miter"/><text x="370" y="1340" font-size="13" text-anchor="start" font-weight="bold" fill="#b0281c">yes</text><polyline points="360,1320 360,1355" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><rect x="180.0" y="1355" width="360" height="68" rx="12" fill="#fff" stroke="#111" stroke-width="2"/><text x="360" y="1384.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">add w to caption (last 4 words)</text><text x="360" y="1403.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">run app: calculator / clock / timer</text><polyline points="360,1423 360,1453" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><rect x="180.0" y="1453" width="360" height="68" rx="12" fill="#fff" stroke="#111" stroke-width="2"/><text x="360" y="1482.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">redraw OLED over SPI3,</text><text x="360" y="1501.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">clear word buffer</text><polyline points="540,1487 1010,1487" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="miter"/><polyline points="1010,1487 1010,330" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="miter"/><polyline points="1010,330 364,330" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><text x="1020" y="700" font-size="13" text-anchor="start" font-weight="normal" fill="#444">back to wait</text><text x="1290" y="98" font-size="20" text-anchor="middle" font-weight="bold" fill="#111">interrupts</text><polyline points="1215,106 1365,106" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="miter"/><polygon points="1142.0,130 1460.0,130 1438.0,200 1120.0,200" fill="#fff" stroke="#111" stroke-width="2"/><text x="1290" y="160.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">EXTI ISR:</text><text x="1290" y="179.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">frame_rdy rising edge</text><polyline points="1290,200 1290,230" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><rect x="1140.0" y="230" width="300" height="68" rx="12" fill="#fff" stroke="#111" stroke-width="2"/><text x="1290" y="259.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">clear EXTI pending bit</text><text x="1290" y="278.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">start SPI1 DMA read (64 B)</text><polyline points="1290,298 1290,328" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><rect x="1220.0" y="328" width="140" height="44" rx="22" fill="#fff" stroke="#111" stroke-width="2"/><text x="1290" y="355.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">return</text><polygon points="1142.0,480 1460.0,480 1438.0,550 1120.0,550" fill="#fff" stroke="#111" stroke-width="2"/><text x="1290" y="510.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">DMA1 transfer-</text><text x="1290" y="529.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">complete ISR</text><polyline points="1290,550 1290,580" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><rect x="1140.0" y="580" width="300" height="68" rx="12" fill="#fff" stroke="#111" stroke-width="2"/><text x="1290" y="609.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">clear DMA flag</text><text x="1290" y="628.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">frame_ready = 1</text><polyline points="1290,648 1290,678" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><rect x="1220.0" y="678" width="140" height="44" rx="22" fill="#fff" stroke="#111" stroke-width="2"/><text x="1290" y="705.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">return</text><polygon points="1142.0,830 1460.0,830 1438.0,900 1120.0,900" fill="#fff" stroke="#111" stroke-width="2"/><text x="1290" y="860.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">RTC wakeup ISR</text><text x="1290" y="879.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">(every 1 s)</text><polyline points="1290,900 1290,930" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><rect x="1140.0" y="930" width="300" height="87" rx="12" fill="#fff" stroke="#111" stroke-width="2"/><text x="1290" y="959.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">clear RTC flag</text><text x="1290" y="978.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">tick clock + timer</text><text x="1290" y="997.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">redraw = 1</text><polyline points="1290,1017 1290,1047" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><rect x="1220.0" y="1047" width="140" height="44" rx="22" fill="#fff" stroke="#111" stroke-width="2"/><text x="1290" y="1074.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">return</text><text x="1290" y="1200" font-size="14" text-anchor="middle" font-weight="normal" fill="#333">ISRs only set flags or start hardware.</text><text x="1290" y="1222" font-size="14" text-anchor="middle" font-weight="normal" fill="#333">All the slow work (MFCC, DTW, OLED)</text><text x="1290" y="1244" font-size="14" text-anchor="middle" font-weight="normal" fill="#333">runs in main.</text></g></svg>