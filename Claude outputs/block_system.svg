<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="960" viewBox="0 0 1860 960" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ar" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#111"/></marker></defs><rect width="1860" height="960" fill="#fff"/><g transform="translate(40,0)"><text x="890" y="45" font-size="24" text-anchor="middle" font-weight="bold" fill="#111">System Block Diagram: Voice-Controlled Smart Glasses</text><rect x="60" y="140" width="200" height="150" rx="0" fill="#fff" stroke="#111" stroke-width="2"/><rect x="60" y="140" width="104.4" height="27" rx="0" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="68" y="160" font-size="15" text-anchor="start" font-weight="bold" fill="#111">PDM mic L</text><text x="160" y="215" font-size="13" text-anchor="middle" font-weight="normal" fill="#444" font-style="italic">Adafruit 3492</text><text x="250" y="185" font-size="14" text-anchor="end" font-weight="normal" fill="#111">CLK</text><text x="250" y="235" font-size="14" text-anchor="end" font-weight="normal" fill="#111">DAT</text><text x="70" y="270" font-size="14" text-anchor="start" font-weight="normal" fill="#111">SEL</text><polyline points="60,265 30,265" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="miter"/><text x="26" y="270" font-size="13" text-anchor="end" font-weight="normal" fill="#111">GND</text><rect x="60" y="430" width="200" height="150" rx="0" fill="#fff" stroke="#111" stroke-width="2"/><rect x="60" y="430" width="104.4" height="27" rx="0" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="68" y="450" font-size="15" text-anchor="start" font-weight="bold" fill="#111">PDM mic R</text><text x="160" y="505" font-size="13" text-anchor="middle" font-weight="normal" fill="#444" font-style="italic">Adafruit 3492</text><text x="250" y="475" font-size="14" text-anchor="end" font-weight="normal" fill="#111">CLK</text><text x="250" y="525" font-size="14" text-anchor="end" font-weight="normal" fill="#111">DAT</text><text x="70" y="560" font-size="14" text-anchor="start" font-weight="normal" fill="#111">SEL</text><polyline points="60,555 30,555" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="miter"/><text x="26" y="560" font-size="13" text-anchor="end" font-weight="normal" fill="#111">3V3</text><rect x="480" y="90" width="400" height="650" rx="0" fill="#fff" stroke="#111" stroke-width="2"/><rect x="480" y="90" width="306.0" height="27" rx="0" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="488" y="110" font-size="15" text-anchor="start" font-weight="bold" fill="#111">iCE40 UP5K FPGA (UPduino v3.1)</text><text x="490" y="185" font-size="14" text-anchor="start" font-weight="normal" fill="#111">pdm_clk</text><text x="490" y="335" font-size="14" text-anchor="start" font-weight="normal" fill="#111">pdm_dat</text><text x="870" y="205" font-size="14" text-anchor="end" font-weight="normal" fill="#111">sck</text><text x="870" y="255" font-size="14" text-anchor="end" font-weight="normal" fill="#111">cs</text><text x="870" y="305" font-size="14" text-anchor="end" font-weight="normal" fill="#111">sdi</text><text x="870" y="355" font-size="14" text-anchor="end" font-weight="normal" fill="#111">sdo</text><text x="870" y="425" font-size="14" text-anchor="end" font-weight="normal" fill="#111">frame_rdy</text><rect x="1100" y="90" width="400" height="650" rx="0" fill="#fff" stroke="#111" stroke-width="2"/><rect x="1100" y="90" width="315.6" height="27" rx="0" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="1108" y="110" font-size="15" text-anchor="start" font-weight="bold" fill="#111">STM32L432KC MCU (Nucleo-L432KC)</text><text x="1110" y="205" font-size="14" text-anchor="start" font-weight="normal" fill="#111">SPI1_SCK</text><text x="1110" y="255" font-size="14" text-anchor="start" font-weight="normal" fill="#111">CS (GPIO)</text><text x="1110" y="305" font-size="14" text-anchor="start" font-weight="normal" fill="#111">SPI1_MOSI</text><text x="1110" y="355" font-size="14" text-anchor="start" font-weight="normal" fill="#111">SPI1_MISO</text><text x="1110" y="425" font-size="14" text-anchor="start" font-weight="normal" fill="#111">EXTI (GPIO in)</text><text x="1490" y="205" font-size="14" text-anchor="end" font-weight="normal" fill="#111">SPI3_SCK</text><text x="1490" y="255" font-size="14" text-anchor="end" font-weight="normal" fill="#111">SPI3_MOSI</text><text x="1490" y="305" font-size="14" text-anchor="end" font-weight="normal" fill="#111">CS (GPIO)</text><text x="1490" y="355" font-size="14" text-anchor="end" font-weight="normal" fill="#111">DC (GPIO)</text><text x="1490" y="405" font-size="14" text-anchor="end" font-weight="normal" fill="#111">RST (GPIO)</text><text x="680" y="490" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">What it does</text><text x="1300" y="490" font-size="14" text-anchor="middle" font-weight="bold" fill="#111">What it does</text><text x="510" y="520" font-size="14" text-anchor="start" font-weight="normal" fill="#333">Generates 1.024 MHz PDM clock</text><text x="510" y="546" font-size="14" text-anchor="start" font-weight="normal" fill="#333">Splits L / R bits by clock edge</text><text x="510" y="572" font-size="14" text-anchor="start" font-weight="normal" fill="#333">CIC + FIR decimation → 16 kHz</text><text x="510" y="598" font-size="14" text-anchor="start" font-weight="normal" fill="#333">Delay-and-subtract beamformer</text><text x="510" y="624" font-size="14" text-anchor="start" font-weight="normal" fill="#333">512-point FFT every 16 ms</text><text x="510" y="650" font-size="14" text-anchor="start" font-weight="normal" fill="#333">  (DSP blocks + SPRAM)</text><text x="510" y="676" font-size="14" text-anchor="start" font-weight="normal" fill="#333">32 log-mel energies → SPI</text><text x="1130" y="520" font-size="14" text-anchor="start" font-weight="normal" fill="#333">SPI1 + DMA reads each frame</text><text x="1130" y="546" font-size="14" text-anchor="start" font-weight="normal" fill="#333">Energy-based speech detection</text><text x="1130" y="572" font-size="14" text-anchor="start" font-weight="normal" fill="#333">MFCCs (DCT of log-mel)</text><text x="1130" y="598" font-size="14" text-anchor="start" font-weight="normal" fill="#333">DTW vs. 57 enrolled templates</text><text x="1130" y="624" font-size="14" text-anchor="start" font-weight="normal" fill="#333">  (templates kept in flash)</text><text x="1130" y="650" font-size="14" text-anchor="start" font-weight="normal" fill="#333">Calculator / clock (RTC) / timer</text><text x="1130" y="676" font-size="14" text-anchor="start" font-weight="normal" fill="#333">OLED text over SPI3</text><polyline points="480,180 260,180" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><circle cx="380" cy="180" r="4.5" fill="#111"/><polyline points="380,180 380,470 262,470" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><polyline points="260,235 410,235 410,330 478,330" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><polyline points="260,525 410,525 410,330" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="miter"/><circle cx="410" cy="330" r="4.5" fill="#111"/><text x="270" y="170" font-size="14" text-anchor="start" font-weight="bold" fill="#b0281c">PDM</text><text x="60" y="640" font-size="14" text-anchor="start" font-weight="bold" fill="#b0281c">PDM clock: 1.024 MHz, shared by both mics</text><text x="60" y="662" font-size="14" text-anchor="start" font-weight="normal" fill="#111">PDM data: one shared line. Mic L drives it</text><text x="60" y="682" font-size="14" text-anchor="start" font-weight="normal" fill="#111">on the rising edge, mic R on the falling</text><text x="60" y="702" font-size="14" text-anchor="start" font-weight="normal" fill="#111">edge (set by each mic's SEL pin).</text><polyline points="1100,200 882,200" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><polyline points="1100,250 882,250" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><polyline points="1100,300 882,300" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><polyline points="880,350 1098,350" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><polyline points="880,420 1098,420" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><text x="990" y="170" font-size="15" text-anchor="middle" font-weight="bold" fill="#b0281c">SPI (MCU = controller)</text><text x="990" y="455" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">32 × 16-bit every 16 ms</text><text x="990" y="473" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">= 64 B / 16 ms ≈ 4 kB/s</text><text x="990" y="410" font-size="13" text-anchor="middle" font-weight="bold" fill="#b0281c">interrupt</text><rect x="1620" y="150" width="170" height="290" rx="0" fill="#fff" stroke="#111" stroke-width="2"/><rect x="1620" y="150" width="56.4" height="27" rx="0" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="1628" y="170" font-size="15" text-anchor="start" font-weight="bold" fill="#111">OLED</text><text x="1705" y="215" font-size="13" text-anchor="middle" font-weight="normal" fill="#444" font-style="italic">SSD1306</text><text x="1705" y="233" font-size="13" text-anchor="middle" font-weight="normal" fill="#444" font-style="italic">128×64</text><polyline points="1500,200 1618,200" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><text x="1630" y="205" font-size="14" text-anchor="start" font-weight="normal" fill="#111">SCK</text><polyline points="1500,250 1618,250" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><text x="1630" y="255" font-size="14" text-anchor="start" font-weight="normal" fill="#111">SDA</text><polyline points="1500,300 1618,300" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><text x="1630" y="305" font-size="14" text-anchor="start" font-weight="normal" fill="#111">CS</text><polyline points="1500,350 1618,350" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><text x="1630" y="355" font-size="14" text-anchor="start" font-weight="normal" fill="#111">DC</text><polyline points="1500,400 1618,400" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><text x="1630" y="405" font-size="14" text-anchor="start" font-weight="normal" fill="#111">RES</text><text x="1560" y="470" font-size="15" text-anchor="middle" font-weight="bold" fill="#b0281c">SPI</text><text x="1560" y="490" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">write-only</text><text x="1560" y="508" font-size="13" text-anchor="middle" font-weight="normal" fill="#111">≤ 1 KB / redraw</text><rect x="1620" y="560" width="170" height="120" rx="0" fill="#fff" stroke="#111" stroke-width="1.8" stroke-dasharray="7 5"/><text x="1705" y="598" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">f = 40 mm lens</text><text x="1705" y="620" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">+ 45° beam splitter</text><text x="1705" y="650" font-size="14" text-anchor="middle" font-weight="normal" fill="#111">→ right eye</text><polyline points="1705,440 1705,558" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="7 5" stroke-linejoin="miter"/><text x="1715" y="505" font-size="13" text-anchor="start" font-weight="normal" fill="#444">light</text><rect x="840" y="820" width="320" height="76" rx="0" fill="#fff" stroke="#111" stroke-width="2"/><text x="1000" y="852" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">USB power bank, 5,000 mAh</text><text x="1000" y="876" font-size="13" text-anchor="middle" font-weight="normal" fill="#444">boards' 3.3 V regulators feed mics + OLED</text><polyline points="840,858 680,858 680,742" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><polyline points="1160,858 1300,858 1300,742" fill="none" stroke="#111" stroke-width="2" marker-end="url(#ar)" stroke-linejoin="miter"/><text x="690" y="800" font-size="13" text-anchor="start" font-weight="normal" fill="#111">USB 5 V</text><text x="1310" y="800" font-size="13" text-anchor="start" font-weight="normal" fill="#111">USB 5 V</text></g></svg>